[build]
  command = "npm run build"
  publish = "dist"

# SPA client-side fallback for Klido Studio routes
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Admin CMS must never be indexed by search engines
[[headers]]
  for = "/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Long-lived immutable cache for hashed Vite build assets
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
